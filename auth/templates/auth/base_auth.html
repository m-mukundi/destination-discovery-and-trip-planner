<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Aura{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('auth.static', filename='css/auth.css') }}">
</head>
<body class="auth-body">
  <main class="auth-card">
    <header class="auth-header">
      <div class="plain text">
        <svg width="34" height="18" viewBox="0 0 34 18" aria-hidden="true">
          <path d="M0 18a17 17 0 0 1 34 0z" fill="#3b4cf2"/>
        </svg>
        <span>Destination App</span>
      </div>
      <h1>{% block heading %}{% endblock %}</h1>
      <p class="subtitle">{% block subtitle %}{% endblock %}</p>
    </header>

    {% block content %}{% endblock %}
  </main>

  <script>
    // Show/hide password toggle (UI only)
    document.querySelectorAll('.toggle-password').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var input = document.getElementById(btn.dataset.target);
        input.type = input.type === 'password' ? 'text' : 'password';
        btn.classList.toggle('is-visible');
      });
    });
  </script>
</body>
</html>
